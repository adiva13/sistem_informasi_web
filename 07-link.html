<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Membuat Link di HTML</title>
</head>
<body>
    <!-- Link eksternal membuka tab baru dengan target="_blank" -->
    <p><a href="https://www.petanikode.com" target="_blank">Buka Website Petani Kode</a></p>

    <!-- Link internal menuju file lokal lain -->
    <p><a href="kontak.html">Halaman Kontak</a></p>

    <!-- Link untuk mengirim email -->
    <p><a href="mailto:admin@example.com">Kirim Email ke Admin</a></p>

    <!-- Link menuju bagian tertentu di halaman yang sama (Anchor) -->
    <p><a href="#bagian-bawah">Lompat ke Bagian Bawah</a></p>

    <div style="margin-top: 600px;" id="bagian-bawah">
        <h3>Ini adalah Bagian Bawah</h3>
    </div>
</body>
</html>
