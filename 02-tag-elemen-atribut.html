<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tag, Elemen, dan Atribut</title>
</head>
<body>

    <!-- 1. Elemen Paragraf Standar -->
    <!-- Tag pembuka <p> dan tag penutup </p> membentuk satu elemen -->
    <p>Ini adalah elemen paragraf.</p>

    <!-- 2. Elemen dengan Atribut -->
    <!-- Atribut ditulis di dalam tag pembuka: nama="nilai" -->
    <!-- Catatan: Berikan spasi antaratribut (id="pengantar" class="catatan") -->
    <p id="pengantar" class="catatan" title="Teks bantuan">Paragraf ini mempunyai tiga atribut.</p>

    <!-- 3. Elemen Kosong (Void Element) -->
    <!-- Elemen tanpa tag penutup -->
    <br>

    <!-- 4. Elemen Bersarang (Nested Element) -->
    <div>
        <p>Paragraf di dalam <strong>div</strong>.</p>
    </div>

</body>
</html>
