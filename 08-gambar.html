<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Menampilkan Gambar di HTML</title>
</head>
<body>
    <h3>Gambar dari URL Internet</h3>
    <img src="https://via.placeholder.com/300x150" alt="Contoh Gambar Placeholder" width="300" height="150">

    <h3>Gambar dari Folder Lokal</h3>
    <!-- Pastikan file gambar.jpg berada di folder yang sama dengan file HTML ini -->
    <img src="gambar.jpg" alt="Deskripsi jika gambar gagal dimuat" width="250">

    <!-- Gambar dengan keterangan (Figure & Figcaption) -->
    <figure>
        <img src="https://via.placeholder.com/200" alt="Ilustrasi">
        <figcaption>Gambar 1. Contoh penggunaan tag figure.</figcaption>
    </figure>
</body>
</html>
