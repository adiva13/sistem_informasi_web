<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Menambahkan Audio di HTML</title>
</head>
<body>
    <h3>Pemutar Musik HTML5</h3>
    <p>Klik tombol putar untuk mendengarkan audio:</p>
    <audio controls>
        <source src="musik-latar.mp3" type="audio/mpeg">
        <source src="musik-latar.ogg" type="audio/ogg">
        Browser Anda tidak mendukung pemutaran tag audio HTML5.
    </audio>
</body>
</html>
