<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Membuat Tabel di HTML</title>
</head>
<body>
    <h3>Daftar Mahasiswa</h3>
    <table border="1" cellpadding="10" cellspacing="0">
        <thead>
            <tr>
                <th>No</th>
                <th>NIM</th>
                <th>Nama Lengkap</th>
                <th>Program Studi</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>D0425302</td>
                <td>Siti Adiva Kirani</td>
                <td>Sistem Informasi</td>
            </tr>
            <tr>
                <td>2</td>
                <td>D0425303</td>
                <td>Ahmad Fauzan</td>
                <td>Teknik Informatika</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3"><strong>Total Mahasiswa</strong></td>
                <td><strong>2 Orang</strong></td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
